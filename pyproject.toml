[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "funding-research-collector"
version = "0.1.0"
description = "Read-only funding event research collector"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
funding-collector = "funding_collector.__main__:main"

[tool.setuptools.packages.find]
include = ["funding_collector*"]

[tool.setuptools.package-data]
funding_collector = ["web/*.html", "web/*.css", "web/*.js"]
